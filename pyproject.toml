[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "snare"
dynamic = ["version"]
description = "Agentless, game-aware cheat analysis sandbox"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["typer>=0.16,<1"]

[project.scripts]
snare = "snare.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.15,<3",
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
]

[tool.hatch.version]
path = "src/snare/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/snare"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
